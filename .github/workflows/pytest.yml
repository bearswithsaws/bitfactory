# Run this job on pushes to `main`, and for pull requests. If you don't specify
# `branches: [main], then this actions runs _twice_ on pull requests, which is
# annoying.
name: Pytest
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you wanted to use multiple Python versions, you'd have specify a matrix in the job and
      # reference the matrixe python version here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install uv - a fast Python package installer and resolver
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Cache dependencies based on uv.lock. uv automatically caches the virtual environment
      # and package downloads, making subsequent runs very fast.
      - name: cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/uv.lock') }}

      # Install dependencies using uv sync. This reads pyproject.toml and uv.lock,
      # creates a virtual environment, and installs all dependencies including dev dependencies.
      # The --frozen flag ensures that uv.lock is used exactly as-is without updating.
      - run: uv sync --frozen --all-groups
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # Run the sync again to ensure the project itself is installed (similar to poetry install)
      - run: uv sync --frozen --all-groups

      # Run tests using uv run, which executes commands in the project's virtual environment.
      # uv run automatically activates the environment, so no need for source .venv/bin/activate
      - run: uv run pytest -s -v --cov=bitfactory --cov-report xml

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.xml