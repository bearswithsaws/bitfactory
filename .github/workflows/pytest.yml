# Run this job on pushes to `main`, and for pull requests. If you don't specify
# `branches: [main], then this actions runs _twice_ on pull requests, which is
# annoying.
name: Pytest
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test across the full supported range, including the minimum (3.9), so
        # version-specific regressions are caught rather than only on 3.11.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install uv - a fast Python package installer and resolver
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Cache dependencies based on the Python version and uv.lock. The version
      # is part of the key so each interpreter gets its own virtualenv.
      - name: cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: pydeps-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}

      # Install dependencies using uv sync. This reads pyproject.toml and uv.lock,
      # creates a virtual environment, and installs all dependencies including dev dependencies.
      # The --frozen flag ensures that uv.lock is used exactly as-is without updating.
      - run: uv sync --frozen --all-groups
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # Run the sync again to ensure the project itself is installed (similar to poetry install)
      - run: uv sync --frozen --all-groups

      # Run tests using uv run, which executes commands in the project's virtual environment.
      # uv run automatically activates the environment, so no need for source .venv/bin/activate
      # Emit LCOV so the Coveralls action can consume it directly.
      - run: uv run pytest -s -v --cov=bitfactory --cov-report=lcov:coverage.lcov

      # Upload coverage once (from a single interpreter) to avoid duplicate reports.
      - name: Coveralls
        if: matrix.python-version == '3.11'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
