[tool.poetry]
name = "bitfactory"
version = "0.1.0"
description = "Create structured binary data easily."
authors = ["Nyz <nyz@bearswithsa.ws>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
ruff = ">=0.4.0"
mypy = "^1.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration - replaces pylint, black, isort, flake8, etc.
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B027",   # empty method in abstract base class (intentional for optional overrides)
    "C901",   # too complex
    "SIM108", # Use ternary operator instead of if-else-block
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F403",   # star imports OK in tests
    "F405",   # may be undefined from star import
]

[tool.ruff.lint.isort]
known-first-party = ["bitfactory"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true